# BlackwellQwen38 — FP8 long-video variant: Qwen/Qwen3.8-27B-FP8 at 500K
# context with the model card's "Long Video Understanding" recipe applied
# entirely from serve config.
#
# The card's recipe raises the VIDEO pixel budget to 469,762,048 (~224K video
# tokens for hour-scale frame sampling) and officially requires editing
# video_preprocessor_config.json inside the checkpoint. Here it is a plain
# --mm-processor-kwargs flag instead — no checkpoint edits — via three patches
# carried in the bq38 images (see README): transformers PR #48071
# (max_pixels_per_frame), the fork's modality-scoped kwargs resolution
# (vllm issue #52834), and the oversized-cache-item fix (vllm issue #52835).
#
# Differences from compose.fp8.yaml:
#   - images pulled from ghcr (or built locally via docker/*.Dockerfile —
#     same content; `docker compose -f compose.fp8.video.yaml build`)
#   - max-model-len 500000, NOT 1M: vLLM profiles one max-size (224K-token)
#     video through the vision encoder and reserves the peak (~26 GiB), which
#     breaks the 1M KV floor. Video capability costs ~half the text ceiling.
#   - video ingest via file:// URLs from the VIDEO_DIR mount on the DIRECT
#     vLLM port (the Anthropic /v1/messages surface has no video content
#     type; base64 is a non-starter for GB-scale files):
#       curl http://127.0.0.1:8000/v1/chat/completions ... \
#         {"type": "video_url", "video_url": {"url": "file:///videos/clip.mp4"}}
#   - Qwen 3.8 is vision-only: audio tracks are discarded.
#
# Usage:
#   cp .env.example .env   # then fill in paths/keys
#   docker compose -f compose.fp8.video.yaml up -d
#
# Variants are mutually exclusive (one GPU): `docker compose -f <current> down`
# before starting another.

name: blackwellqwen38

services:
  vllm:
    # Published by this repo's build-images workflow from the fork pin tags
    # in docker/pins.env; the build: block reproduces it locally when you
    # can't pull (same Dockerfile, same pinned refs).
    image: ghcr.io/dkrisman/bq38-vllm:bq38-4
    build:
      context: ./docker
      dockerfile: vllm.Dockerfile
    container_name: bq38-vllm
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"   # direct port — video requests go here
    volumes:
      - ${HF_CACHE_DIR:?set HF_CACHE_DIR in .env}:/root/.cache/huggingface
      - triton-cache:/root/.triton
      - ${VIDEO_DIR:-./videos}:/videos:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    command:
      - "--model"
      - "Qwen/Qwen3.8-27B-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--tensor-parallel-size"
      - "1"
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.94"
      - "--max-model-len"
      - "500000"                         # 1M -> 500K funds the video encoder
      - "--hf-overrides"                 # reservation (see header) and a second
      - '{"text_config": {"max_position_embeddings": 500000}}'  # video per prompt
      - "--mm-encoder-tp-mode"
      - "data"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-num-seqs"
      - "16"
      - "--max-num-batched-tokens"
      - "16384"                          # HARD ceiling on Qwen 3.8 (GDN prefill
                                         # workspace — see compose.fp8.yaml)
      - "--enable-prefix-caching"
      - "--speculative-config"
      - '{"method":"mtp","num_speculative_tokens":3}'
      - "--served-model-name"
      - "qwen-3.8-fp8-27b-video-500k"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      - "--reasoning-parser"
      - "qwen3"
      - "--supported-reasoning-efforts"  # fork feature, vLLM PR #52739
      - "low"
      - "medium"
      - "xhigh"
      # ── The long-video recipe, config-only ────────────────────────────────
      # videos_kwargs scopes both knobs to the VIDEO processor (images keep
      # their stock 16.7M-pixel budget):
      #   size.longest_edge 469762048 = the card's 224K-video-token budget
      #   max_pixels_per_frame 611669 = budget / 768 max frames — short clips
      #     cost proportional to duration instead of budget-filling (a 90 s
      #     clip drops ~184K -> ~53K tokens; fully sampled videos unaffected)
      - "--mm-processor-kwargs"
      - '{"videos_kwargs": {"size": {"longest_edge": 469762048, "shortest_edge": 4096}, "max_pixels_per_frame": 611669}}'
      - "--limit-mm-per-prompt"
      - '{"image": 4, "video": 2}'       # video:2 = clip comparison
      - "--mm-processor-cache-gb"
      - "24"                             # a processed movie-scale item is
                                         # ~3-5 GB; 24 holds ~4-6 warm items
                                         # (needs ~32 GB host RAM headroom)
      - "--media-io-kwargs"              # torchcodec decode (faster than the
      - '{"video": {"backend": "torchcodec"}}'  # opencv default)
      - "--allowed-local-media-path"
      - "/videos"

  litellm:
    image: ghcr.io/dkrisman/bq38-litellm:bq38-4
    build:
      context: ./docker
      dockerfile: litellm.Dockerfile
    container_name: bq38-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./configs/litellm-fp8-video.yaml:/app/config.yaml:ro
      - ${BRAVE_API_KEY_FILE:?set BRAVE_API_KEY_FILE in .env}:/run/secrets/brave-api-key:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      # Claude Code sends mid-conversation system-role reminder messages;
      # Qwen's chat template rejects non-leading system rows. Fork feature
      # (litellm PR #37351): "drop" removes them, which also keeps the
      # conversation prefix stable for vLLM's prefix cache; set "true" to
      # demote them to user rows instead.
      LITELLM_DEMOTE_MIDTURN_SYSTEM: "drop"
      CLAUDE_WEBSEARCH_PROVIDERS: hosted_vllm
      CLAUDE_WEBSEARCH_API_KEY_FILE: /run/secrets/brave-api-key
      CLAUDE_WEBSEARCH_DAILY_LIMIT: ${WEBSEARCH_DAILY_LIMIT:-500}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - vllm

volumes:
  triton-cache:
