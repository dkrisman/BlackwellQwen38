name: build-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/build-images.yml

permissions:
  contents: read
  packages: write

jobs:
  vllm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: grep -v '^#' docker/pins.env >> "$GITHUB_ENV"
      - name: Free runner disk (vLLM base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bq38-vllm
        run: |
          docker buildx build --push \
            -f docker/vllm.Dockerfile \
            --build-arg BASE_IMAGE="$VLLM_BASE_IMAGE" \
            --build-arg VLLM_REF="$VLLM_REF" \
            --build-arg VLLM_WHEEL_SHA="$VLLM_WHEEL_SHA" \
            --build-arg TRANSFORMERS_REF="$TRANSFORMERS_REF" \
            -t "ghcr.io/dkrisman/bq38-vllm:$PIN" \
            docker/

  litellm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: grep -v '^#' docker/pins.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bq38-litellm
        run: |
          docker buildx build --push \
            -f docker/litellm.Dockerfile \
            --build-arg BASE_IMAGE="$LITELLM_BASE_IMAGE" \
            --build-arg LITELLM_REF="$LITELLM_REF" \
            --build-arg PLUGIN_REF="$PLUGIN_REF" \
            -t "ghcr.io/dkrisman/bq38-litellm:$PIN" \
            docker/
